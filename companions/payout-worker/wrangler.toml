name = "precog-earn-payout"
main = "src/index.mjs"
compatibility_date = "2026-11-15"

# Database: append-only share credits + payout plan/executed logs.
# Free tier on Workers (100k req/day) and D1 (5 GB) easily covers a pilot.
[[d1_databases]]
binding = "LEDGER"
database_name = "precog-earn-ledger"
database_id = "d69afa29-3b30-4c7a-bd79-6ec251f5613c"

# DO NOT add secrets to this file. Set them with:
#   wrangler secret put ADMIN_TOKEN       (bearer for operator endpoints)
#   wrangler secret put NODE_HMAC_KEY     (HMAC shared key for node receipts)
#   wrangler secret put RPC_URL           (operator's monero-wallet-rpc, e.g. http://127.0.0.1:18082)
#   wrangler secret put RPC_AUTH          (base64 user:pass for the wallet RPC)
# Toggle:
#   wrangler secret put APPROVE_AUTO_BATCH   ("1" to arm automatic settlement)
#   set HALT=1 via wrangler.toml or `wrangler secret put HALT` to freeze all spend paths
# DRY_RUN defaults to 1 in src/index.mjs; it refuses to spend unless explicitly set to 0.

[vars]
DRY_RUN = "1"
MAX_BATCH_XMR = "0.5"        # absolute cap per settlement cycle (operator-tunable)
MIN_REDEEM_XMR = "0.001"     # per-destination dust floor
MAX_SHARES_PER_RECEIPT = "100000"     # anti-inflation cap on signed share claims (claims are not PoW)
MAX_SHARES_PER_USER_WINDOW = "1000000" # rolling accrual cap per handle within the window
SHARE_WINDOW_SECONDS = "3600"         # rolling window length for the per-user cap (1h)
PAYOUT_INTERVAL_DAYS = "7"   # informational; settlement trigger is operator call
PAYOUT_CRON = "0"            # set to "1" to arm a WEEKLY report-only heartbeat; never executes XMR
# Optional weekly trigger, entirely inert unless PAYOUT_CRON changes:
# [triggers]
# crons = ["0 4 * * 1"]       # 04:00 UTC every Monday
