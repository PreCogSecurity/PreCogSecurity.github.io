<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precog OS · v86 Cybersecurity Workspace</title>
    <!-- Font Awesome, Chart.js, Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- v86 core library -->
    <script src="https://copy.sh/v86/libv86.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #c8e6ff;
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            padding: 1.2rem;
        }
        .dashboard { max-width: 1600px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2a4a;
            margin-bottom: 1.5rem;
        }
        .header .brand { display: flex; align-items: center; gap: 1rem; }
        .header .brand h1 {
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #33ccff, #ff77aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .brand i { font-size: 2.2rem; color: #33ccff; }
        .header .status { display: flex; align-items: center; gap: 2rem; font-size: 0.9rem; flex-wrap: wrap; }
        .header .status .online { color: #33ff99; }
        .header .status .online i { animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { opacity:1; } 50% { opacity:0.3; } 100% { opacity:1; } }
        .clock { color: #88bbdd; font-family: 'Courier New', monospace; }

        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .emulator-panel {
            background: #111128;
            border: 1px solid #1f2a5a;
            border-radius: 16px;
            padding: 1rem;
        }
        .emulator-panel h3 {
            font-weight: 300;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6688bb;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #1a2a4a;
            padding-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }
        #screen_container {
            background: #000;
            border: 1px solid #33ccff;
            border-radius: 8px;
            width: 100%;
            aspect-ratio: 4/3;
            max-height: 480px;
            position: relative;
            overflow: hidden;
        }
        #screen_container canvas { display: block; width: 100%; height: 100%; }
        .serial-terminal {
            background: #0a0a1a;
            border: 1px solid #1a2a4a;
            border-radius: 8px;
            padding: 0.5rem;
            margin-top: 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #33ff99;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .serial-terminal .input-line { display: flex; align-items: center; gap: 0.3rem; }
        .serial-terminal .input-line span { color: #33ccff; }
        .serial-terminal .input-line input {
            background: transparent;
            border: none;
            color: #33ff99;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            flex: 1;
            outline: none;
        }
        .serial-terminal .output { color: #c8e6ff; }
        .serial-terminal .error { color: #ff4466; }

        .dashboard-panel {
            background: #111128;
            border: 1px solid #1f2a5a;
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .dashboard-panel h3 {
            font-weight: 300;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6688bb;
            border-bottom: 1px solid #1a2a4a;
            padding-bottom: 0.3rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.8rem;
        }
        .stat-card {
            background: #0a0a1a;
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            border: 1px solid #1a2a4a;
        }
        .stat-card .label { font-size: 0.6rem; text-transform: uppercase; color: #6688bb; }
        .stat-card .value { font-size: 1.3rem; font-weight: 600; color: #fff; }
        .stat-card .sub { font-size: 0.6rem; color: #88aadd; }

        .chart-map-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .chart-map-row .chart-container { height: 120px; }
        .chart-map-row .map-container { height: 120px; border-radius: 8px; overflow: hidden; border: 1px solid #1a2a4a; }
        #threatMap { width: 100%; height: 100%; }

        .alert-feed {
            background: #0a0a1a;
            border-radius: 10px;
            padding: 0.5rem;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #1a2a4a;
            font-size: 0.7rem;
        }
        .alert-feed .alert-item {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0;
            border-bottom: 1px solid #1a2244;
        }
        .alert-feed .alert-item .severity {
            font-weight: bold;
            padding: 0.05rem 0.5rem;
            border-radius: 12px;
            font-size: 0.5rem;
        }
        .severity.critical { background: #cc3355; color: #fff; }
        .severity.high { background: #ff8833; color: #000; }
        .severity.medium { background: #ffcc33; color: #000; }
        .severity.low { background: #33aaff; color: #000; }

        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #446688;
            font-size: 0.8rem;
            border-top: 1px solid #1a2244;
            padding-top: 1.5rem;
        }
        .footer i { color: #33ccff; }

        .btn-sm {
            background: #1a2a5a;
            border: none;
            color: #c8e6ff;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .btn-sm:hover { background: #2a3a7a; }

        @media (max-width: 1000px) {
            .main-grid { grid-template-columns: 1fr; }
            .chart-map-row { grid-template-columns: 1fr; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a1a; }
        ::-webkit-scrollbar-thumb { background: #2a3a6a; border-radius: 10px; }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- Header -->
    <header class="header">
        <div class="brand">
            <i class="fas fa-shield-alt"></i>
            <h1>PRECOG · v86 SECURITY OS</h1>
        </div>
        <div class="status">
            <span class="online"><i class="fas fa-circle"></i> System Online</span>
            <span class="clock" id="clockDisplay">--:--:--</span>
            <span style="color:#6688bb; font-size:0.8rem;"><i class="fas fa-microchip"></i> x86 · WASM</span>
            <button class="btn-sm" onclick="saveState()"><i class="fas fa-save"></i> Save</button>
            <button class="btn-sm" onclick="restoreState()"><i class="fas fa-undo"></i> Restore</button>
        </div>
    </header>

    <!-- Main Grid: Emulator + Dashboard -->
    <div class="main-grid">
        <!-- Left: v86 Emulator -->
        <div class="emulator-panel">
            <h3>
                <span><i class="fas fa-desktop"></i> Linux Console</span>
                <span class="badge" style="font-size:0.6rem;background:#1a2a5a;padding:0.2rem 0.6rem;border-radius:12px;color:#88bbdd;">Alpine</span>
            </h3>
            <div id="screen_container"></div>
            <div class="serial-terminal" id="serialTerminal">
                <div class="output">⏳ Booting Linux via v86...</div>
                <div class="input-line">
                    <span>#</span>
                    <input type="text" id="serialInput" placeholder="Type commands here..." disabled />
                </div>
            </div>
        </div>

        <!-- Right: Dashboard -->
        <div class="dashboard-panel">
            <h3><i class="fas fa-chart-line"></i> Threat Dashboard</h3>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">Active Threats</div>
                    <div class="value" id="activeThreats">247</div>
                    <div class="sub">+12 last hour</div>
                </div>
                <div class="stat-card">
                    <div class="label">Blocked</div>
                    <div class="value" id="attacksBlocked">1,843</div>
                    <div class="sub">Last 24h</div>
                </div>
                <div class="stat-card">
                    <div class="label">Critical</div>
                    <div class="value" id="criticalAlerts">4</div>
                    <div class="sub">Need action</div>
                </div>
            </div>
            <div class="chart-map-row">
                <div class="chart-container">
                    <canvas id="attackChart"></canvas>
                </div>
                <div class="map-container">
                    <div id="threatMap"></div>
                </div>
            </div>
            <div class="alert-feed" id="alertFeed">
                <div style="color:#6688bb; border-bottom:1px solid #1a2244; padding-bottom:0.2rem; font-size:0.7rem;">
                    <i class="fas fa-bell"></i> Live Alerts
                </div>
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <i class="fas fa-code-branch"></i> Powered by <strong>v86</strong> · x86 Emulation ·
        <span style="color:#33ccff;">Precog Security</span> ·
        <i class="fas fa-infinity"></i> No API keys
    </footer>
</div>

<script>
    // ================================================================
    //  1. v86 EMULATOR SETUP
    // ================================================================
    var emulator = null;
    var serialBuffer = '';

    function initEmulator() {
        const container = document.getElementById('screen_container');
        try {
            emulator = new V86Starter({
                screen_container: container,
                bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
                // Use Alpine Linux minimal image from v86 examples
                hda: { url: "https://copy.sh/v86/images/alpine.img" },
                // Also attach a CD-ROM with the Linux kernel (in case boot fails)
                cdrom: { url: "https://copy.sh/v86/images/linux.iso" },
                autostart: true,
                // Serial output for terminal
                serial0: function(data) {
                    appendSerial(data);
                }
            });

            // Enable serial input after boot
            document.getElementById('serialInput').disabled = false;
            document.getElementById('serialInput').focus();
            appendSerial('✅ v86 emulator started. Linux boot in progress...\n');
        } catch (e) {
            appendSerial('❌ Emulator init failed: ' + e.message);
        }
    }

    // Serial output handler
    function appendSerial(text) {
        const term = document.getElementById('serialTerminal');
        // Remove the "output" divs and keep only the input line
        const inputLine = term.querySelector('.input-line');
        // Clear all children except the input-line
        while (term.firstChild && term.firstChild !== inputLine) {
            term.removeChild(term.firstChild);
        }
        // Create a new output div for the text
        const div = document.createElement('div');
        div.className = 'output';
        div.textContent = text;
        term.insertBefore(div, inputLine);
        term.scrollTop = term.scrollHeight;
    }

    // Serial input: send command to emulator
    document.getElementById('serialInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const cmd = this.value;
            this.value = '';
            if (emulator) {
                // Send command to serial port (simulate typing)
                // v86 doesn't have a direct serial send, but we can use keyboard input
                // For simplicity, we'll use the keyboard emulation:
                // Actually, v86 supports serial0_send(str) for guests that handle serial input.
                // But many Linux guests don't. We'll fallback to keyboard simulation.
                // We'll send the command via keyboard (not ideal but works for shell)
                // Simulate typing each character then enter
                for (let ch of cmd) {
                    emulator.keyboard_send(0x??); // This is complex
                }
                // Instead, we can use the emulator's built-in serial send if available:
                if (emulator.serial0_send) {
                    emulator.serial0_send(cmd + '\n');
                    appendSerial('$ ' + cmd + '\n');
                } else {
                    appendSerial('⚠️ Serial input not supported in this v86 build.\n');
                }
            }
        }
    });

    // ================================================================
    //  2. SAVE / RESTORE STATE
    // ================================================================
    function saveState() {
        if (!emulator) return;
        emulator.save_state(function(state) {
            localStorage.setItem('v86_state', JSON.stringify(state));
            appendSerial('💾 State saved.\n');
        });
    }

    function restoreState() {
        const data = localStorage.getItem('v86_state');
        if (!data || !emulator) return;
        try {
            const state = JSON.parse(data);
            emulator.restore_state(state, function() {
                appendSerial('🔄 State restored.\n');
            });
        } catch (e) {
            appendSerial('❌ Restore failed: ' + e.message);
        }
    }

    // ================================================================
    //  3. DASHBOARD: Stats, Map, Chart, Alerts
    // ================================================================
    function randomBetween(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function updateStats() {
        document.getElementById('activeThreats').textContent = randomBetween(200, 300);
        document.getElementById('attacksBlocked').textContent = randomBetween(1500, 2200).toLocaleString();
        document.getElementById('criticalAlerts').textContent = randomBetween(2, 8);
    }
    setInterval(updateStats, 5000);

    // Clock
    function updateClock() {
        const now = new Date();
        document.getElementById('clockDisplay').textContent = now.toUTCString().split(' ')[4];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Leaflet Map
    const map = L.map('threatMap', { center: [20, 0], zoom: 2, zoomControl: false, attributionControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);
    const threatLocs = [
        [40.7128, -74.0060], [51.5074, -0.1278], [35.6895, 139.6917],
        [55.7558, 37.6173], [23.1291, 113.2644], [37.7749, -122.4194],
        [28.6139, 77.2090], [-33.8688, 151.2093], [48.8566, 2.3522]
    ];
    threatLocs.forEach(latlng => {
        L.circleMarker(latlng, {
            radius: 4,
            color: '#ff4466',
            fillColor: '#ff4466',
            fillOpacity: 0.6,
            weight: 1,
            className: 'threat-pulse'
        }).addTo(map);
    });
    const style = document.createElement('style');
    style.textContent = `.threat-pulse { animation: pulse-threat 1.5s infinite; }
        @keyframes pulse-threat { 0% { opacity:0.6; transform:scale(1); }
        50% { opacity:1; transform:scale(1.5); }
        100% { opacity:0.6; transform:scale(1); } }`;
    document.head.appendChild(style);

    // Chart
    const ctx = document.getElementById('attackChart').getContext('2d');
    const attackChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['DDoS', 'Phishing', 'Malware', 'Ransomware', 'Insider'],
            datasets: [{
                data: [35, 25, 20, 12, 8],
                backgroundColor: ['#33ccff', '#ff8833', '#ff4466', '#ffcc33', '#aa66ff'],
                borderColor: '#0a0a1a',
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#c8e6ff', font: { size: 8, family: 'Segoe UI' } } } },
            cutout: '60%',
        }
    });
    setInterval(() => {
        attackChart.data.datasets[0].data = [
            randomBetween(20,45), randomBetween(15,35), randomBetween(10,30),
            randomBetween(5,20), randomBetween(3,15)
        ];
        attackChart.update();
    }, 8000);

    // Alerts
    const alertMessages = [
        { msg: 'SSH brute-force from 185.165.29.101', sev: 'critical' },
        { msg: 'Malware in email attachment', sev: 'high' },
        { msg: 'Unusual outbound traffic', sev: 'medium' },
        { msg: 'Failed admin login attempts', sev: 'high' },
        { msg: 'New ransomware variant', sev: 'critical' },
        { msg: 'Port scan from 198.51.100.77', sev: 'low' },
        { msg: 'DNS tunneling detected', sev: 'medium' },
        { msg: 'Privilege escalation attempt', sev: 'high' },
    ];
    function addAlert(msg, sev = 'medium') {
        const feed = document.getElementById('alertFeed');
        const item = document.createElement('div');
        item.className = 'alert-item';
        item.innerHTML = `<span>${msg}</span><span class="severity ${sev}">${sev.toUpperCase()}</span>`;
        feed.appendChild(item);
        while (feed.children.length > 12) feed.removeChild(feed.children[1]);
        feed.scrollTop = feed.scrollHeight;
    }
    for (let i = 0; i < 5; i++) {
        const a = alertMessages[i % alertMessages.length];
        addAlert(a.msg, a.sev);
    }
    setInterval(() => {
        const a = alertMessages[Math.floor(Math.random() * alertMessages.length)];
        addAlert(a.msg, a.sev);
    }, 7000);

    // ================================================================
    //  4. BOOT
    // ================================================================
    initEmulator();

    console.log('🛡️ Precog v86 Security OS initialized');
</script>
</body>
</html>
